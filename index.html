<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>html.i18n-loading body{visibility:hidden}</style>
<script>
(function(){var d=document.documentElement,l='fa';
try{l=localStorage.getItem('site-lang')||'fa'}catch(e){}
d.lang=l;d.dir=l==='fa'?'rtl':'ltr';d.classList.add('i18n-loading');
setTimeout(function(){d.classList.remove('i18n-loading')},1500);})();
</script>
  <title>Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

  <!-- Soft glowing background shapes (the glass blurs these) -->
  <div class="bg" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <button class="lang-btn" id="langBtn" type="button" data-no-i18n aria-label="Switch language">EN</button>
  <!-- Hamburger button -->
  <button class="burger" id="burger" aria-label="Open navigation" aria-expanded="false" aria-controls="drawer">
    <span></span><span></span><span></span>
  </button>

  <!-- Hamburger drawer: 6 links -->
  <div class="scrim" id="scrim"></div>
  <nav class="drawer glass" id="drawer" aria-label="Main navigation" aria-hidden="true">
  <ul>
    <li><a href="pages/menu.html#starters">Starters</a></li>
    <li><a href="pages/menu.html#mains">Main courses</a></li>
    <li><a href="pages/menu.html#desserts">Desserts</a></li>
    <li><a href="pages/menu.html#drinks">Drinks</a></li>
    <li><a href="pages/menu.html#contact">Reservations</a></li>
  </ul>
</nav>

  <main class="page">

    <!-- Top: title -->
    <header class="title glass">
      <h1>Menu</h1>
    </header>

    <!-- Middle: logo upload -->
   <section class="logo-card glass">
  <div class="logo-frame">
    <img src="imgs/dot-caffee-logo-1024-white.png" alt="Restaurant logo">
  </div>
</section>

    <!-- Bottom: restaurant description -->
    <section class="about glass">
      <p id="about">Good taste, fresh coffee, and moments worth enjoying. At Bahmahas, discover unique flavours and make every visit a memorable experience.
      </p>
    </section>

    <!-- Button -->
    <a class="cta" href="pages/menu.html">View the menu</a>

  </main>

  <script src="js/app.js"></script>
  <script src="js/lang.js"></script>
</body>
</html>
